services:
  - type: web
    name: ica
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    disk:
      name: ica-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        generateValue: true
      - key: ICA_DATA_DIR
        value: /var/data/data
      - key: ICA_UPLOAD_DIR
        value: /var/data/uploads
      - key: TRUST_PROXY_HOPS
        value: "1"
